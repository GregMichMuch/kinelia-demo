# Diagnostic temporaire (V1.1, « cause du moteur principal »), 2e passage :
# chiffrement (TLS) des serveurs d'archive.org comparé aux sites qui marchent.
name: Diagnostic moteur
on:
  push:
    branches: [diagnostic-moteur]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mesures TLS
        run: |
          out=resultats-tls.txt; : > "$out"
          hosts="archive.org"
          for u in $(grep -o 'https://archive\.org[^ ]*' demo.m3u | tr -d '\r' | sort -u | head -4); do
            h=$(curl -sI --max-time 20 "$u" | grep -i '^location:' | sed -E 's#.*https://([^/]+)/.*#\1#' | tr -d '\r')
            hosts="$hosts $h"
          done
          hosts="$hosts download.blender.org test-streams.mux.dev cdn.theoplayer.com demo.unified-streaming.com"
          for h in $hosts; do
            echo "===== $h" >> "$out"
            for v in tls1_2 tls1_3; do
              r=$(echo | timeout 15 openssl s_client -connect "$h:443" -servername "$h" -$v 2>&1 | grep -E '^(New|    Protocol|    Cipher|Verify return)' | tr '\n' ' ')
              echo "$v : ${r:-échec}" >> "$out"
            done
            echo | timeout 15 openssl s_client -connect "$h:443" -servername "$h" -showcerts 2>/dev/null | grep -E '^ *[0-9] s:|i:|a:PKEY' | head -8 >> "$out"
            echo "Sans SNI (tls1_2) : $(echo | timeout 15 openssl s_client -connect "$h:443" -tls1_2 -noservername 2>&1 | grep -E '^New|alert|error' | head -2 | tr '\n' ' ')" >> "$out"
            echo "HTTP/1.1 sur ALPN : $(curl -s -o /dev/null --http1.1 --max-time 15 -w '%{http_code} %{http_version}' https://$h/ )" >> "$out"
          done
          cat "$out"
      - name: Résultats dans la branche
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git pull -q --rebase || true
          git add resultats-tls.txt
          git commit -m "Résultats du diagnostic TLS [skip ci]"
          git push
