# Diagnostic temporaire (V1.1, « cause du moteur principal ») : réponse
# d'archive.org selon l'identité annoncée par chaque moteur. Branche à supprimer.
name: Diagnostic moteur
on:
  push:
    branches: [diagnostic-moteur]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && ffmpeg -version | head -1
      - name: Mesures
        run: |
          out=resultats-diagnostic.txt
          : > "$out"
          lavf="Lavf/$(ffmpeg -version | head -1 | awk '{print $3}' | cut -d. -f1-2)"
          grep -o 'https\?://[^ ]*archive\.org[^ ]*' demo.m3u | tr -d '\r' | sort -u > urls.txt
          echo "Titres archive.org : $(wc -l < urls.txt)" >> "$out"
          n=0
          while read -r u; do
            n=$((n+1))
            echo "" >> "$out"; echo "===== Titre $n : $u" >> "$out"
            for ua in "$lavf" "Lavf/61.7.100" "Dalvik/2.1.0 (Linux; U; Android 14)" "ExoPlayer" "curl/8"; do
              r=$(curl -s -o /dev/null -L --max-time 20 -A "$ua" -H 'Range: bytes=0-' -H 'Icy-MetaData: 1' \
                   -w '%{http_code} | sauts=%{num_redirects} | type=%{content_type} | taille=%{size_download} | fin=%{url_effective}' \
                   --max-filesize 1 "$u" 2>&1 || true)
              echo "UA [$ua] -> $r" >> "$out"
            done
            echo "-- Chaîne de renvois (en-têtes, UA $lavf) :" >> "$out"
            curl -sIL --max-time 20 -A "$lavf" "$u" | grep -iE '^(HTTP/|location|content-type|content-length|accept-ranges|server)' >> "$out" || true
            echo "-- 512 premiers octets avec Range (UA $lavf), en hexadécimal :" >> "$out"
            curl -sL --max-time 20 -A "$lavf" -H 'Range: bytes=0-511' "$u" | head -c 64 | xxd | head -4 >> "$out" || true
            echo "-- ffprobe (FFmpeg du bureau, UA par défaut) :" >> "$out"
            timeout 40 ffprobe -v error -show_entries format=format_name,duration -of compact "$u" >> "$out" 2>&1 || echo "ffprobe : code $?" >> "$out"
            echo "-- ffprobe sans Icy, sans multiple_requests, seekable=0 :" >> "$out"
            timeout 40 ffprobe -v error -icy 0 -seekable 0 -show_entries format=format_name -of compact "$u" >> "$out" 2>&1 || echo "ffprobe : code $?" >> "$out"
          done < urls.txt
          cat "$out"
      - name: Résultats dans la branche
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add resultats-diagnostic.txt
          git commit -m "Résultats du diagnostic moteur [skip ci]"
          git push
